<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset password</title>
</head>
<body>
<h2>Reset password</h2>
<form id="resetForm">
  <input id="token" name="token" type="hidden">
  <input name="password" type="password" placeholder="New password (min 8 chars)" required><br>
  <button type="submit">Reset password</button>
</form>
<script>
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

document.getElementById('token').value = getQueryParam('token') || '';

document.getElementById('resetForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.target));
  const res = await fetch('/src/reset_password.php', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(fd)
  });
  const j = await res.json();
  alert(j.message || JSON.stringify(j));
});
</script>
</body>
</html>
